[build-system]
requires = ["setuptools>=77,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "lfs-bulk-prices"
dynamic = ["version"]
description = "Bulk prices (price tiers by quantity) for LFS"
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE.txt"]
authors = [{ name = "Kai Diefenbach" }]
keywords = ["django", "e-commerce", "online-shop"]
classifiers = [
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 5.2",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
]
requires-python = ">=3.12"
dependencies = [
    "django-lfs>=1.0,<2",
]

[project.urls]
Source = "https://github.com/diefenbach/lfs-bulk-prices"

[tool.setuptools.packages.find]
include = ["lfs_bulk_prices*"]

[tool.setuptools.package-data]
lfs_bulk_prices = ["templates/**/*", "static/**/*", "locale/**/*"]

[tool.setuptools.dynamic]
version = { attr = "lfs_bulk_prices.__version__" }

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "lfs_bulk_prices.tests.settings"
addopts = "--nomigrations"
python_files = ["test_*.py"]
